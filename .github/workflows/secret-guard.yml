name: secret-guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if secrets or private keys are present
        run: |
          set -euo pipefail
          hits=$(find . -type f \(
            -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx'
          \) ! -name '.env.example' ! -path './.git/*' || true)
          if [ -n "$hits" ]; then
            echo "Blocked sensitive files:"
            echo "$hits"
            exit 1
          fi
          if grep -R --binary-files=without-match -E 'BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY' --exclude-dir=.git .; then
            echo "Blocked: private key material found"
            exit 1
          fi
          echo "No env files or private keys found."
